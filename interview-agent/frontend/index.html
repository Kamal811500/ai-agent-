<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Agent — Adaptive Technical Interviews</title>
  <meta name="description" content="Adaptive AI-powered technical interviews with real-time evaluation and actionable feedback."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ─── Variables ─────────────────────────────────────────────────────────────── */
:root {
  --bg:         #EEEDF8;
  --bg2:        #E5E4F2;
  --white:      #FFFFFF;
  --primary:    #4F46E5;
  --primary-d:  #4338CA;
  --primary-lt: #EEF2FF;
  --primary-md: #C7D2FE;
  --text:       #111827;
  --text-b:     #374151;
  --text-m:     #6B7280;
  --text-l:     #9CA3AF;
  --border:     #E5E7EB;
  --border-l:   #F3F4F6;
  --green:      #059669;
  --green-l:    #ECFDF5;
  --amber:      #D97706;
  --amber-l:    #FFFBEB;
  --red:        #DC2626;
  --red-l:      #FEF2F2;
  --r:          12px;
  --r-lg:       18px;
  --r-xl:       24px;
  --sh:         0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh-md:      0 4px 20px rgba(0,0,0,.09);
  --sh-lg:      0 8px 40px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
#root{min-height:100vh}

/* ─── Scrollbar ─────────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7D2FE;border-radius:99px}

/* ─── Animations ────────────────────────────────────────────────────────────── */
@keyframes fadeUp   {from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn   {from{opacity:0}to{opacity:1}}
@keyframes scaleIn  {from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp  {from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn  {from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut {from{opacity:1}to{opacity:0;transform:scale(.9)}}
@keyframes pulse    {0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
@keyframes spin     {to{transform:rotate(360deg)}}
@keyframes shimmer  {0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes barGrow  {from{width:0}to{width:var(--target-w)}}
@keyframes confetti {0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}

.fade-up   {animation:fadeUp   .45s cubic-bezier(.22,1,.36,1) both}
.fade-in   {animation:fadeIn   .3s ease both}
.scale-in  {animation:scaleIn  .35s cubic-bezier(.22,1,.36,1) both}
.slide-left{animation:slideLeft.4s  cubic-bezier(.22,1,.36,1) both}

/* ─── Layout ────────────────────────────────────────────────────────────────── */
.page{min-height:100vh;display:flex;flex-direction:column}
.centered{display:flex;align-items:center;justify-content:center}

/* ─── Card ──────────────────────────────────────────────────────────────────── */
.card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh);
}
.card-hover{transition:box-shadow .2s,border-color .2s,transform .2s}
.card-hover:hover{box-shadow:var(--sh-md);border-color:var(--primary-md);transform:translateY(-2px)}

/* ─── Buttons ───────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;font-family:inherit;font-weight:600;
  transition:all .18s;border-radius:10px;white-space:nowrap;
}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn:active:not(:disabled){transform:scale(.97)}

.btn-primary{
  padding:12px 24px;font-size:14px;
  background:var(--primary);color:#fff;
  box-shadow:0 2px 10px rgba(79,70,229,.3);
}
.btn-primary:hover:not(:disabled){background:var(--primary-d);box-shadow:0 4px 20px rgba(79,70,229,.4)}

.btn-lg{padding:14px 32px;font-size:16px;border-radius:12px}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}

.btn-ghost{
  padding:10px 18px;font-size:14px;
  background:transparent;color:var(--text-b);
  border:1px solid var(--border);
}
.btn-ghost:hover:not(:disabled){background:var(--border-l);border-color:var(--primary-md)}

.btn-danger{
  padding:9px 16px;font-size:13px;
  background:var(--red-l);color:var(--red);
  border:1px solid #FECACA;
}
.btn-danger:hover{background:#FEE2E2}

/* ─── Inputs ────────────────────────────────────────────────────────────────── */
.input{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--white);color:var(--text);
  font-family:inherit;font-size:15px;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.input::placeholder{color:var(--text-l)}
.input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.1)}

.textarea{
  width:100%;padding:16px;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--white);color:var(--text);
  font-family:inherit;font-size:15px;line-height:1.65;
  outline:none;resize:none;
  transition:border-color .18s,box-shadow .18s;
}
.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.textarea::placeholder{color:var(--text-l)}

.label{display:block;font-size:13px;font-weight:600;color:var(--text-b);margin-bottom:6px}
.field{margin-bottom:18px}
.input-hint{font-size:12px;color:var(--text-m);margin-top:5px}
.err-msg{font-size:12px;color:var(--red);margin-top:5px;display:flex;align-items:center;gap:4px}

/* ─── Badges ────────────────────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:99px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
}
.badge-indigo{background:var(--primary-lt);color:var(--primary);border:1px solid var(--primary-md)}
.badge-green {background:var(--green-l);color:var(--green);border:1px solid #A7F3D0}
.badge-amber {background:var(--amber-l);color:var(--amber);border:1px solid #FDE68A}
.badge-red   {background:var(--red-l);color:var(--red);border:1px solid #FECACA}
.badge-gray  {background:var(--border-l);color:var(--text-m);border:1px solid var(--border)}

/* ─── Progress bar ──────────────────────────────────────────────────────────── */
.prog-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill {height:100%;background:var(--primary);border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ─── Score bar ─────────────────────────────────────────────────────────────── */
.score-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.score-fill {height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}

/* ─── Skill tag ─────────────────────────────────────────────────────────────── */
.skill-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:7px;
  background:var(--primary-lt);border:1px solid var(--primary-md);
  color:var(--primary);font-size:12.5px;font-weight:500;
}
.skill-tag button{
  background:none;border:none;cursor:pointer;
  color:var(--primary);opacity:.6;padding:0;line-height:1;font-size:14px;
  transition:opacity .15s;
}
.skill-tag button:hover{opacity:1}

/* ─── Divider ───────────────────────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:0}

/* ─── Shimmer ───────────────────────────────────────────────────────────────── */
.shimmer{
  background:linear-gradient(90deg,#EEEDF8 25%,#E5E4F2 50%,#EEEDF8 75%);
  background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:var(--r);
}

/* ─── Spinner ───────────────────────────────────────────────────────────────── */
.spinner{
  width:20px;height:20px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;animation:spin .7s linear infinite;
}
.spinner-dark{border-color:rgba(79,70,229,.2);border-top-color:var(--primary)}

/* ─── Toast ─────────────────────────────────────────────────────────────────── */
.toast-container{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  pointer-events:auto;
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;border-radius:12px;
  background:var(--text);color:#fff;
  font-size:14px;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  animation:toastIn .3s ease both;
  max-width:340px;
}
.toast.success{background:#065F46}
.toast.error  {background:#7F1D1D}
.toast.info   {background:#1E3A5F}
.toast.warning{background:#78350F}

/* ─── Sidebar nav ───────────────────────────────────────────────────────────── */
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:var(--text-b);
  cursor:pointer;transition:background .15s,color .15s;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--primary-lt);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff}

/* ─── Curriculum step ───────────────────────────────────────────────────────── */
.curr-step{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;font-size:13px;font-weight:500;
  color:var(--text-l);
}
.curr-step.done  {color:var(--text-m)}
.curr-step.active{color:var(--primary);font-weight:600}

/* ─── Sidebar mobile overlay ────────────────────────────────────────────────── */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;
}
.sidebar-overlay.open{display:block}

/* ─── Stat card ─────────────────────────────────────────────────────────────── */
.stat-card{padding:16px;border-radius:var(--r);background:var(--bg);border:1px solid var(--border-l)}
.stat-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
           border-radius:9px;background:var(--primary-lt);margin-bottom:10px;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-m);margin-bottom:3px}
.stat-value{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}

/* ─── Landing hero ──────────────────────────────────────────────────────────── */
.hero{
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px;
}
.hero-content{
  max-width:680px;text-align:center;
  padding:80px 0 60px;
}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin-bottom:20px}
.hero p{font-size:17px;color:var(--text-m);line-height:1.7;max-width:520px;margin:0 auto 28px}
.pill-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 18px;border-radius:99px;
  border:1.5px solid var(--primary-md);background:var(--white);
  font-size:14px;font-weight:500;color:var(--primary);
  box-shadow:var(--sh);margin-bottom:28px;
}
.feature-pills{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:36px;font-size:13px;color:var(--text-m)}
.dot-sep{color:var(--border);font-size:16px}
.how-it-works{width:100%;max-width:900px;padding-bottom:80px}
.hiw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px;margin-top:24px}
.hiw-card{padding:22px 20px}
.hiw-num{width:34px;height:34px;border-radius:9px;background:var(--primary-lt);
          display:flex;align-items:center;justify-content:center;
          font-size:12px;font-weight:700;color:var(--primary);margin-bottom:14px}
.hiw-title{font-weight:700;font-size:15px;margin-bottom:7px}
.hiw-desc{font-size:13px;color:var(--text-m);line-height:1.6}

/* ─── Auth screen ───────────────────────────────────────────────────────────── */
.auth-wrap{
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.auth-card{width:100%;max-width:440px;padding:40px;border-radius:var(--r-xl);box-shadow:var(--sh-lg)}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.auth-logo-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#818CF8,#4F46E5);display:flex;align-items:center;justify-content:center;color:#fff}
.auth-logo-text{font-weight:800;font-size:17px;color:var(--text)}
.auth-title{font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
.auth-sub  {font-size:14px;color:var(--text-m);text-align:center;margin-bottom:28px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-l);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-footer{font-size:12px;color:var(--text-l);text-align:center;margin-top:20px;line-height:1.6}

/* ─── Profile setup ─────────────────────────────────────────────────────────── */
.profile-wrap{
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;
}
.profile-topbar{
  padding:16px 32px;background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.profile-content{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%;max-width:820px}
.profile-card{padding:28px}
.profile-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-m);margin-bottom:18px}
.step-indicator{display:flex;align-items:center;gap:8px}
.step-dot{width:8px;height:8px;border-radius:50%}
.step-dot.done{background:var(--primary)}
.step-dot.current{background:var(--primary);box-shadow:0 0 0 3px var(--primary-lt)}
.step-dot.todo{background:var(--border)}
.focus-chip{
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;
  border:1.5px solid var(--border);background:var(--white);cursor:pointer;
  transition:all .15s;color:var(--text-b);
}
.focus-chip.selected{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
.exp-stepper{display:flex;align-items:center;gap:12px}
.exp-stepper button{
  width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--white);cursor:pointer;font-size:18px;color:var(--primary);
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-weight:700;
}
.exp-stepper button:hover{border-color:var(--primary);background:var(--primary-lt)}
.exp-val{font-size:20px;font-weight:800;color:var(--text);min-width:40px;text-align:center}

/* ─── Briefing screen ───────────────────────────────────────────────────────── */
.brief-wrap{
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;
}
.brief-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;width:100%;max-width:780px}
.brief-profile-card{padding:28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brief-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#818CF8,#4F46E5);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:26px;
  border:3px solid var(--primary-md);margin-bottom:14px;
}
.brief-overview-card{padding:28px}
.brief-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.brief-timeline{margin-top:0}
.brief-tl-item{display:flex;gap:12px;margin-bottom:14px;font-size:13.5px}
.brief-tl-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--primary-lt);border:1.5px solid var(--primary-md);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--primary);flex-shrink:0;
}

/* ─── Interview screen ──────────────────────────────────────────────────────── */
.interview-layout{display:flex;height:100vh;background:var(--bg)}
.interview-sidebar{
  width:220px;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:transform .3s;z-index:30;
}
.interview-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.interview-topbar{
  height:56px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;
}
.interview-body{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.question-card{padding:24px 28px}
.question-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.question-sep{width:100%;height:1px;background:var(--border);margin-bottom:20px}
.question-text{font-size:19px;font-weight:600;line-height:1.55;color:var(--text)}
.answer-card{flex:1}
.answer-header{
  padding:12px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.answer-body{flex:1;padding:4px}
.answer-footer{
  padding:12px 18px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-radius:0 0 var(--r-lg) var(--r-lg);
}
.interview-timer{font-size:13px;font-weight:600;color:var(--primary);
                 display:flex;align-items:center;gap:5px}
.hamburger{
  display:none;background:none;border:none;cursor:pointer;
  padding:8px;border-radius:8px;color:var(--text-b);
  flex-direction:column;gap:4px;
}
.hamburger span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px}

/* ─── Results screen ────────────────────────────────────────────────────────── */
.results-layout{display:flex;height:100vh;background:var(--bg)}
.results-sidebar{
  width:220px;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px;
}
.results-main{flex:1;overflow-y:auto;padding:28px}
.results-topbar{
  height:56px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  flex-shrink:0;
}
.results-grid-top{display:grid;grid-template-columns:1fr 200px;gap:16px;margin-bottom:16px}
.results-score-box{
  background:var(--primary);border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;color:#fff;
}
.results-grid-mid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.results-gap-card{padding:20px;margin-bottom:16px}
.results-cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}

/* ─── Confetti ──────────────────────────────────────────────────────────────── */
.confetti-piece{
  position:fixed;width:10px;height:10px;border-radius:2px;
  animation:confetti linear forwards;
  pointer-events:none;z-index:9999;
}

/* ─── Responsive ────────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .results-grid-top{grid-template-columns:1fr}
  .results-grid-mid{grid-template-columns:1fr 1fr}
  .results-sidebar{display:none}
  .results-layout{display:block;height:auto;overflow:auto}
  .results-main{padding:16px}
}
@media (max-width:768px){
  .profile-grid{grid-template-columns:1fr}
  .brief-grid{grid-template-columns:1fr}
  .profile-topbar{padding:12px 16px}
  .interview-sidebar{
    position:fixed;left:0;top:0;bottom:0;
    transform:translateX(-100%);
  }
  .interview-sidebar.open{transform:translateX(0);box-shadow:var(--sh-lg)}
  .hamburger{display:flex}
  .interview-body{padding:16px}
  .results-grid-mid{grid-template-columns:1fr}
  .hiw-grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:32px}
  .auth-card{padding:28px}
  .profile-content{padding:16px}
  .brief-wrap{padding:20px 16px;align-items:flex-start;justify-content:flex-start}
}
@media (max-width:480px){

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useReducer } = React;
const API = '/api';

/* ─── API layer ─────────────────────────────────────────────────────────────── */
const http = {
  async post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({ detail: r.statusText }));
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    return data;
  },
  async get(url) {
    const r = await fetch(url);
    const data = await r.json().catch(() => ({ detail: r.statusText }));
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    return data;
  },
};
const api = {
  login: (email, name) => http.post(`${API}/auth/login`, { email, name }),
  startInterview: (profile) => http.post(`${API}/interviews/start`, profile),
  submitAnswer: (id, qid, answer) => http.post(`${API}/interviews/${id}/respond`, { question_id: qid, answer }),
  getReport: (id) => http.get(`${API}/interviews/${id}/report`),
};

/* ─── Helpers ───────────────────────────────────────────────────────────────── */
function scoreColor(v, max = 100) {
  const p = v / max;
  return p >= .8 ? '#059669' : p >= .65 ? '#4F46E5' : p >= .5 ? '#D97706' : '#DC2626';
}
function recLabel(r) {
  return { STRONG_HIRE: 'Strong Hire', HIRE: 'Hire', BORDERLINE: 'Borderline', NO_HIRE: 'No Hire' }[r] || r;
}
function recColor(r) {
  return { STRONG_HIRE:'#059669', HIRE:'#4F46E5', BORDERLINE:'#D97706', NO_HIRE:'#DC2626' }[r] || '#6B7280';
}
function fmtTime(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function diffBadge(d) {
  return { easy:'badge-green', medium:'badge-indigo', hard:'badge-amber', expert:'badge-red' }[d] || 'badge-gray';
}
function levelFromExp(y) { return y < 2 ? 'Junior' : y < 6 ? 'Mid-level' : 'Senior'; }

/* ─── LocalStorage ──────────────────────────────────────────────────────────── */
const LS = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};

/* ─── Toast system ──────────────────────────────────────────────────────────── */
function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((msg, type = 'info') => {
    const id = Date.now() + Math.random();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
  }, []);
  return { toasts, show };
}

function ToastContainer({ toasts }) {
  if (!toasts.length) return null;
  const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span style={{fontSize:16,flexShrink:0}}>{icons[t.type] || 'ℹ'}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

/* ─── Confetti ──────────────────────────────────────────────────────────────── */
function Confetti() {
  const colors = ['#4F46E5','#818CF8','#10B981','#F59E0B','#EF4444','#EC4899'];
  const pieces = Array.from({ length: 40 }, (_, i) => ({
    id: i,
    color: colors[i % colors.length],
    left: `${Math.random() * 100}%`,
    delay: `${Math.random() * 2}s`,
    duration: `${2 + Math.random() * 3}s`,
    size: `${6 + Math.random() * 8}px`,
  }));
  return (
    <>
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{
          background: p.color, left: p.left, top: '-20px',
          width: p.size, height: p.size,
          animationDelay: p.delay, animationDuration: p.duration,
        }} />
      ))}
    </>
  );
}

            {n:'04',title:'Get Feedback',desc:'Receive a structured report with scores, strengths, and improvement plan.'},
          ].map((s,i) => (
            <div key={i} className="card hiw-card card-hover fade-up" style={{animationDelay:`${.2+i*.08}s`}}>
              <div className="hiw-num">{s.n}</div>
              <div className="hiw-title">{s.title}</div>

}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCREEN 2: LOGIN
═══════════════════════════════════════════════════════════════════════════════ */
function LoginScreen({ onLogin, onBack, toast }) {
  const [email, setEmail]   = useState('');
  const [name, setName]     = useState('');
  const [loading, setLoading] = useState(false);
  const [errors, setErrors] = useState({});

  const validate = () => {
    const e = {};
    if (!email.includes('@')) e.email = 'Enter a valid email address';
    if (name.trim().length < 2) e.name = 'Enter your full name';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async () => {
    if (!validate() || loading) return;
    setLoading(true);
    try {
      const user = await api.login(email.trim(), name.trim());
      LS.set('ai_interview_user', user);
      toast('Welcome, ' + user.name.split(' ')[0] + '! 👋', 'success');
      onLogin(user);
    } catch (e) {
      toast(e.message, 'error');
    } finally { setLoading(false); }
  };

  const handleKey = (e) => { if (e.key === 'Enter') submit(); };

  return (
    <div className="auth-wrap fade-in">
      <div className="card auth-card scale-in">
        {/* Logo */}
        <div className="auth-logo">
          <div className="auth-logo-icon">{I.bot}</div>
          <div className="auth-logo-text">AI Interview Agent</div>
        </div>

        <div className="auth-title">Welcome!</div>
        <div className="auth-sub">Enter your email to get started — no password needed.</div>

        <div className="field">
          <label className="label">Email address</label>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-l)'}}>{I.mail}</div>
            <input className={`input ${errors.email?'error':''}`} type="email" placeholder="you@example.com"
              value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey}
              style={{paddingLeft:40}} autoFocus autoComplete="email"/>
          </div>
          {errors.email && <div className="err-msg">⚠ {errors.email}</div>}
        </div>

        <div className="field">
          <label className="label">Full name</label>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-l)'}}>{I.user}</div>
            <input className={`input ${errors.name?'error':''}`} type="text" placeholder="Alex Johnson"
              value={name} onChange={e=>setName(e.target.value)} onKeyDown={handleKey}
              style={{paddingLeft:40}} autoComplete="name"/>
          </div>
          {errors.name && <div className="err-msg">⚠ {errors.name}</div>}
        </div>

        <button className="btn btn-primary" style={{width:'100%',padding:'13px',fontSize:15}} onClick={submit} disabled={loading}>
          {loading ? <><div className="spinner" style={{width:16,height:16}}/> Signing in...</> : <>Continue {I.arrow}</>}
        </button>

        <div className="auth-footer">
          By continuing, you agree to our Terms of Service.<br/>
          Your data is not stored beyond this session.
        </div>

        <div style={{textAlign:'center',marginTop:16}}>
          <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back to Home</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCREEN 3: PROFILE SETUP
═══════════════════════════════════════════════════════════════════════════════ */
const FOCUS_AREAS = [
  'Python','JavaScript','Databases','Machine Learning',
  'System Design','APIs','Algorithms','Security',
  'Cloud','DevOps','Deep Learning','Data Structures',
];
const ROLE_SUGGESTIONS = [
  'Software Engineer','Full Stack Developer','Backend Engineer',
  'Frontend Engineer','ML Engineer','Data Scientist','DevOps Engineer',
];

function ProfileSetup({ user, onContinue, onLogout, toast }) {
  const [role, setRole]       = useState('');
  const [exp, setExp]         = useState(2);
  const [skills, setSkills]   = useState([]);
  const [skillInput, setSkillInput] = useState('');
  const [focus, setFocus]     = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');
  const [showRoleSugg, setShowRoleSugg] = useState(false);

  const applyPreset = (presetRole, presetExp, presetSkills, presetFocus) => {
    setRole(presetRole);
    setExp(presetExp);
    setSkills(presetSkills);
    setFocus(presetFocus);
    toast(`Loaded preset: ${presetRole}`, 'info');
  };

  const addSkill = (s) => {
    const sk = s.trim();
    if (sk && !skills.includes(sk) && skills.length < 20) {
      setSkills(p => [...p, sk]);
      setSkillInput('');
    }
  };
  const removeSkill = (s) => setSkills(p => p.filter(x => x !== s));
  const toggleFocus = (f) => setFocus(p => p.includes(f) ? p.filter(x=>x!==f) : [...p, f]);

  const handleSkillKey = (e) => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addSkill(skillInput); }
    if (e.key === 'Backspace' && !skillInput && skills.length) removeSkill(skills[skills.length-1]);
  };

  const submit = async () => {
    if (!role.trim()) { setError('Please enter your role or job title.'); return; }
    if (skills.length < 1) { setError('Add at least one skill.'); return; }
    setError(''); setLoading(true);
    try {
      const state = await api.startInterview({
        name: user.name, email: user.email,
        role: role.trim(), experience_years: exp,
        skills, focus_areas: focus,
      });
      onContinue(state, { role, exp, skills, focus });
    } catch(e) {
      toast(e.message, 'error');
      setError(e.message);
    } finally { setLoading(false); }
  };

  const roleSugg = ROLE_SUGGESTIONS.filter(r => r.toLowerCase().includes(role.toLowerCase()) && r !== role);

  return (
    <div className="profile-wrap">
      {/* Top bar */}
      <div className="profile-topbar">
        <div style={{display:'flex',alignItems:'center',gap:9,fontWeight:700,fontSize:15}}>
          <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#818CF8,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13}}>{I.bot}</div>
          AI Interview Agent
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {[1,2,3].map(n => (
              <div key={n} className={`step-dot ${n===1?'done':n===2?'current':'todo'}`}/>
            ))}
          </div>
          <span style={{fontSize:12,color:'var(--text-m)',fontWeight:500}}>Step 2 of 3</span>
          <button className="btn btn-ghost btn-sm" onClick={onLogout} style={{gap:6}}>
            {I.logout} Sign out
          </button>
        </div>
      </div>

      {/* Content */}
      <div className="profile-content" style={{flexDirection:'column',alignItems:'center'}}>
        {/* Sample Profile Presets */}
        <div style={{width:'100%',maxWidth:820,marginBottom:16,background:'var(--white)',padding:'14px 20px',borderRadius:14,border:'1px solid var(--border)',boxShadow:'var(--sh)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text-b)',display:'flex',alignItems:'center',gap:6}}>
            ⚡ Quick Sample Presets:
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-ghost btn-sm" style={{fontSize:12,padding:'5px 10px'}}
              onClick={()=>applyPreset('Junior Software Engineer', 1, ['Python', 'Flask', 'SQL', 'Git'], ['Python', 'Algorithms'])}>
              Junior Engineer (1y)
            </button>
            <button className="btn btn-ghost btn-sm" style={{fontSize:12,padding:'5px 10px'}}
              onClick={()=>applyPreset('Mid Full Stack Developer', 4, ['React', 'Node.js', 'PostgreSQL', 'Docker', 'REST APIs'], ['Databases', 'APIs', 'System Design'])}>
              Mid-Level Developer (4y)
            </button>
            <button className="btn btn-ghost btn-sm" style={{fontSize:12,padding:'5px 10px'}}
              onClick={()=>applyPreset('Senior ML Engineer', 8, ['PyTorch', 'Transformers', 'Kubeflow', 'System Design', 'MLOps'], ['Machine Learning', 'Deep Learning', 'LLMs', 'MLOps'])}>
              Senior ML Engineer (8y)
            </button>
          </div>
        </div>

        <div className="profile-grid">
          {/* Left card: Personal info */}
          <div className="card profile-card scale-in">
            <div className="profile-section-title">Your Profile</div>

            {/* Avatar & Name (from login) */}
            <div style={{display:'flex',alignItems:'center',gap:14,padding:'14px',background:'var(--bg)',borderRadius:12,marginBottom:22}}>
              <div style={{width:48,height:48,borderRadius:'50%',background:'linear-gradient(135deg,#818CF8,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:18,flexShrink:0}}>
                {user.name[0].toUpperCase()}
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>{user.name}</div>
                <div style={{fontSize:13,color:'var(--text-m)'}}>{user.email}</div>
              </div>
            </div>

            {/* Role */}
            <div className="field" style={{position:'relative'}}>
              <label className="label">Current Role / Job Title</label>
              <input className="input" type="text" placeholder="e.g. Full Stack Developer"
                value={role} onChange={e=>{setRole(e.target.value);setShowRoleSugg(true)}}
                onBlur={()=>setTimeout(()=>setShowRoleSugg(false),150)}/>
              {showRoleSugg && role && roleSugg.length > 0 && (
                <div style={{position:'absolute',top:'100%',left:0,right:0,background:'var(--white)',border:'1.5px solid var(--primary-md)',borderRadius:10,boxShadow:'var(--sh-md)',zIndex:20,marginTop:4}}>
                  {roleSugg.slice(0,4).map(r => (
                    <div key={r} onClick={()=>{setRole(r);setShowRoleSugg(false)}}
                      style={{padding:'10px 14px',cursor:'pointer',fontSize:14,color:'var(--text-b)',transition:'background .12s'}}
                      onMouseEnter={e=>e.target.style.background='var(--bg)'}
                      onMouseLeave={e=>e.target.style.background='transparent'}>
                      {r}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Experience */}
            <div className="field">
              <label className="label">Years of Experience</label>
              <div className="exp-stepper">
                <button onClick={()=>setExp(Math.max(0,exp-1))}>−</button>
                <div className="exp-val">{exp}</div>
                <button onClick={()=>setExp(Math.min(30,exp+1))}>+</button>
                <div style={{fontSize:13,color:'var(--text-m)',marginLeft:4}}>
                  years · <strong>{levelFromExp(exp)}</strong>
                </div>
              </div>
            </div>
          </div>

          {/* Right card: Skills & Focus */}
          <div className="card profile-card scale-in" style={{animationDelay:'.05s'}}>
            <div className="profile-section-title">Skills & Focus Areas</div>

            {/* Skills tag input */}
            <div className="field">
              <label className="label">Technical Skills <span style={{color:'var(--text-l)',fontWeight:400}}>({skills.length}/20)</span></label>
              <div style={{
                minHeight:80,padding:'8px 10px',border:'1.5px solid var(--border)',borderRadius:10,
                display:'flex',flexWrap:'wrap',gap:6,cursor:'text',background:'var(--white)',
                transition:'border-color .18s'
              }}
                onClick={e=>{const inp=e.currentTarget.querySelector('input');inp&&inp.focus()}}
                onFocus={e=>e.currentTarget.style.borderColor='var(--primary)'}
                onBlur={e=>e.currentTarget.style.borderColor='var(--border)'}>
                {skills.map(s => (
                  <span key={s} className="skill-tag">
                    {s}<button onClick={()=>removeSkill(s)}>×</button>
                  </span>
                ))}
                <input style={{border:'none',outline:'none',fontSize:14,minWidth:120,flex:1,background:'transparent',color:'var(--text)'}}
                  value={skillInput}
                  onChange={e=>setSkillInput(e.target.value)}
                  onKeyDown={handleSkillKey}
                  placeholder={skills.length===0?'Type skill, press Enter...':''}/>
              </div>
              <div className="input-hint">Press Enter or comma to add · Backspace to remove last</div>
            </div>

            {/* Focus areas */}
            <div className="field">
              <label className="label">Interview Focus Areas <span style={{color:'var(--text-l)',fontWeight:400}}>(optional)</span></label>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {FOCUS_AREAS.map(f => (
                  <button key={f} className={`focus-chip ${focus.includes(f)?'selected':''}`}
                    onClick={()=>toggleFocus(f)}>
                    {f}
                  </button>
                ))}
              </div>
            </div>

            {error && <div className="err-msg" style={{marginBottom:14}}>⚠ {error}</div>}

            <button className="btn btn-primary" style={{width:'100%',padding:'13px',fontSize:15,marginTop:'auto'}}
              onClick={submit} disabled={loading}>
              {loading ? <><div className="spinner" style={{width:16,height:16}}/> Creating interview...</> : <>Start Interview {I.arrow}</>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCREEN 5: INTERVIEW
═══════════════════════════════════════════════════════════════════════════════ */
function InterviewScreen({ initialState, user, profile, onComplete, toast }) {
  const [state, setState]       = useState(initialState);
  const [answer, setAnswer]     = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [elapsed, setElapsed]   = useState(0);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [milestone, setMilestone] = useState({ q8:false, d4:false });
  const textareaRef             = useRef(null);
  const startRef                = useRef(Date.now());

  // Timer
  useEffect(() => {
    const id = setInterval(() => setElapsed(Math.floor((Date.now()-startRef.current)/1000)), 1000);
    return () => clearInterval(id);
  }, []);

  // Auto-save draft
  useEffect(() => {
    if (state.current_question_id) {
      const saved = LS.get('draft_' + state.current_question_id);
      if (saved) setAnswer(saved);
      else setAnswer('');
    }
  }, [state.current_question_id]);

  useEffect(() => {
    if (state.current_question_id && answer) {
      LS.set('draft_' + state.current_question_id, answer);
    }
  }, [answer]);

  // Milestone toasts
  useEffect(() => {
    const qn = state.progress?.question_count || 0;
    const dn = state.progress?.unique_days_covered || 0;
    if (qn >= 8 && !milestone.q8) {
      toast('🎯 8 questions reached!', 'success');
      setMilestone(m => ({...m, q8:true}));
    }
    if (dn >= 4 && !milestone.d4) {
      toast('📚 4 topics covered!', 'success');
      setMilestone(m => ({...m, d4:true}));
    }
  }, [state.progress?.question_count, state.progress?.unique_days_covered]);

  const submit = useCallback(async () => {
    if (submitting || !state.current_question_id) return;
    setSubmitting(true);
    try {
      LS.del('draft_' + state.current_question_id);
      const newState = await api.submitAnswer(state.interview_id, state.current_question_id, answer.trim());
      setState(newState);
      setAnswer('');
      if (newState.status === 'COMPLETED') {
        toast('Interview complete! 🎉 Generating your report...', 'success');
        onComplete(newState.interview_id);
      }
    } catch(e) {
      toast(e.message, 'error');
    } finally { setSubmitting(false); setTimeout(()=>textareaRef.current?.focus(), 100); }
  }, [answer, submitting, state]);

  const handleKey = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  };

  const qNum    = state.progress?.question_count || 0;
  const totalQ  = 10;
  const daysNum = state.progress?.unique_days_covered || 0;
  const coverage = state.progress?.curriculum_coverage || {};
  const covEntries = Object.entries(coverage);
  const currDay = state.curriculum_day;

  return (
    <div className="interview-layout">
      {/* Mobile overlay */}
      <div className={`sidebar-overlay ${sidebarOpen?'open':''}`} onClick={()=>setSidebarOpen(false)}/>

      {/* Sidebar */}
      <div className={`interview-sidebar ${sidebarOpen?'open':''}`}>
        {/* Logo */}
        <div style={{padding:'16px 18px 14px',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,fontWeight:700,fontSize:13,color:'var(--text)'}}>
            {I.bot} AI Interview Agent
          </div>
        </div>

        {/* User */}
        <div style={{padding:'12px 16px 12px',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,#818CF8,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:13,flexShrink:0}}>
              {user.name[0]}
            </div>
            <div>
              <div style={{fontSize:13,fontWeight:600}}>{user.name.split(' ')[0]}</div>
              <div style={{fontSize:11,color:'var(--text-m)'}}>{profile.role}</div>
            </div>
          </div>
        </div>

        {/* Progress */}
        <div style={{padding:'14px 16px',flex:1,overflowY:'auto'}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text-l)',marginBottom:12}}>Curriculum Progress</div>

          {covEntries.length > 0 ? (
            covEntries.map(([day, cov]) => {
              const isActive = String(day) === String(currDay);
              const isDone   = !isActive;
              return (
                <div key={day} className={`curr-step ${isActive?'active':isDone?'done':''}`}>
                  {isActive ? I.dot : I.done_c}
                  <div style={{flex:1}}>
                    <div>{cov.topic?.split(' ').slice(0,3).join(' ')}</div>
                    {isActive && <div style={{fontSize:11,color:'var(--primary)',opacity:.7}}>In progress</div>}
                    {isDone && <div style={{fontSize:11,color:'var(--text-l)'}}>{cov.questions}Q · avg {cov.avg_score}/10</div>}
                  </div>
                </div>
              );
            })
          ) : (
            <div className="curr-step active">{I.dot} <span>Starting...</span></div>
          )}

          {/* Milestone badges */}
          <div style={{marginTop:16,display:'flex',flexDirection:'column',gap:6}}>
            <div style={{fontSize:11,display:'flex',alignItems:'center',gap:6,color:qNum>=8?'var(--green)':'var(--text-l)'}}>
              {qNum>=8?'✓':'○'} {qNum}/8 questions required
            </div>
            <div style={{fontSize:11,display:'flex',alignItems:'center',gap:6,color:daysNum>=4?'var(--green)':'var(--text-l)'}}>
              {daysNum>=4?'✓':'○'} {daysNum}/4 topics required
            </div>
          </div>
        </div>

        {/* End session */}
        <div style={{padding:'12px 16px',borderTop:'1px solid var(--border)'}}>
          <button onClick={()=>{if(confirm('End this interview session?'))window.location.reload()}}
            style={{display:'flex',alignItems:'center',gap:8,background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:13,fontWeight:500,padding:'4px 0'}}>
            {I.logout} End Session
          </button>
        </div>
      </div>

      {/* Main */}
      <div className="interview-main">
        {/* Top bar */}
        <div className="interview-topbar">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <button className="hamburger" onClick={()=>setSidebarOpen(!sidebarOpen)} aria-label="Menu">
              <span/><span/><span/>
            </button>
            <div style={{fontSize:14,color:'var(--text-m)',fontWeight:500}}>
              Question <strong style={{color:'var(--text)'}}>{qNum}</strong> of {totalQ}
              <span style={{margin:'0 10px',color:'var(--border)'}}>•</span>
              Adaptive interview
            </div>
            <div style={{width:72}}>
              <div className="prog-track">
                <div className="prog-fill" style={{width:`${Math.min(100,(qNum/totalQ)*100)}%`}}/>
              </div>
            </div>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div className="interview-timer">
              <div style={{width:7,height:7,borderRadius:'50%',background:'var(--primary)',animation:'pulse 1.5s infinite'}}/>
              {fmtTime(elapsed)}
            </div>
            {state.difficulty && <span className={`badge ${diffBadge(state.difficulty)}`}>{state.difficulty}</span>}
            {state.is_followup && <span className="badge badge-amber">↪ Follow-up</span>}
            <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,fontWeight:600,color:'var(--primary)'}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:'var(--green)'}}/>
              Interviewing
            </div>
          </div>
        </div>

        {/* Body */}
        <div className="interview-body">
          {/* Question card */}
          <div className="card question-card fade-in" key={state.current_question_id}>
            <div className="question-meta">
              {state.curriculum_topic && (
                <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--text-m)'}}>
                  Curriculum: {state.curriculum_topic}
                </span>
              )}
              {state.curriculum_topic && <span style={{color:'var(--border)'}}>|</span>}
              {state.difficulty && (
                <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--text-m)'}}>
                  Difficulty: {state.difficulty}
                </span>
              )}
              {state.is_followup && <><span style={{color:'var(--border)'}}>|</span>
              <span style={{fontSize:11,fontWeight:700,color:'var(--amber)',textTransform:'uppercase',letterSpacing:'.07em'}}>↪ Follow-up</span></>}
            </div>
            <div className="question-sep"/>
            <p className="question-text">
              {submitting ? (
                <span style={{display:'flex',alignItems:'center',gap:10,color:'var(--text-m)'}}>
                  <div className="spinner-dark spinner"/>
                  AI is evaluating your answer...
                </span>
              ) : (
                state.current_question || 'Loading next question...'
              )}
            </p>
          </div>

          {/* Answer card */}
          <div className="card answer-card" style={{display:'flex',flexDirection:'column',minHeight:300}}>
            <div className="answer-header">
              <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,fontWeight:500,color:'var(--text-m)'}}>
                {I.code} Your Answer
              </div>
              <button className="btn btn-ghost btn-sm" style={{fontSize:12,padding:'5px 10px',gap:4}}
                onClick={()=>setAnswer('I don\'t know the answer to this question.')}
                title="Use if you're not sure">
                I don't know
              </button>
            </div>

            <div style={{flex:1}}>
              <textarea ref={textareaRef} className="textarea" value={answer}
                onChange={e=>setAnswer(e.target.value)} onKeyDown={handleKey}
                placeholder="Explain your reasoning and include examples if useful... (Ctrl+Enter to submit)"
                style={{borderRadius:0,border:'none',height:'100%',minHeight:220,resize:'none'}}
                disabled={submitting}/>
            </div>

            <div className="answer-footer">
              <div style={{fontSize:13,color:'var(--text-m)',display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}>
                <span><strong style={{color:answer.length>50?'var(--text)':'var(--text-l)'}}>{answer.length}</strong> chars</span>
                <span style={{color:'var(--text-l)',fontSize:11}}>Ctrl+Enter to submit</span>
              </div>
              <button className="btn btn-primary" onClick={submit} disabled={submitting || !state.current_question_id} style={{gap:8}}>
                {submitting ? <><div className="spinner" style={{width:14,height:14}}/> Evaluating...</> : <>Submit Answer {I.arrow}</>}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCREEN 6: RESULTS DASHBOARD
═══════════════════════════════════════════════════════════════════════════════ */
function ResultsScreen({ interviewId, user, profile, onNew, toast }) {
  const [report, setReport]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [showConfetti, setShowConfetti] = useState(false);
  const [activeTab, setActiveTab] = useState('overview');

  // Support form state
  const [supportMsg, setSupportMsg] = useState('');
  const [supportSent, setSupportSent] = useState(false);

  // Settings state
  const [ragEnabled, setRagEnabled] = useState(true);
  const [mcpEnabled, setMcpEnabled] = useState(true);

  useEffect(() => {
    let attempts = 0;
    const poll = async () => {
      try {
        const r = await api.getReport(interviewId);
        setReport(r); setLoading(false);
        if (r.overall_score >= 70) setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 5000);
      } catch {
        if (++attempts < 12) setTimeout(poll, 2000);
        else { setLoading(false); toast('Report generation timed out.','error'); }
      }
    };
    setTimeout(poll, 1500);
  }, []);

  const printReport = () => window.print();

  const downloadJsonReport = () => {
    if (!report) return;
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `interview_report_${interviewId.slice(0, 8)}.json`;
    a.click();
    toast('JSON report downloaded!', 'success');
  };

  const sendSupportMsg = (e) => {
    e.preventDefault();
    if (!supportMsg.trim()) return;
    setSupportSent(true);
    toast('Support ticket submitted successfully!', 'success');
    setSupportMsg('');
    setTimeout(() => setSupportSent(false), 4000);
  };

  const scoreRows = report ? [
    ['Technical Knowledge', Math.min(99,Math.round(report.overall_score*1.05))],
    ['Problem Solving',     Math.min(99,Math.round(report.overall_score*0.97))],
    ['Technical Depth',    Math.min(99,Math.round(report.overall_score*0.95))],
    ['Practical Application',Math.min(99,Math.round(report.overall_score*1.03))],
    ['Communication',      Math.min(99,Math.round(report.overall_score))],
    ['Consistency',        Math.min(99,Math.round(report.overall_score*0.98))],
  ] : [];

  const navItems = [
    {id:'overview',   icon:I.dash,      label:'Overview'},
    {id:'skills',     icon:I.chart,     label:'Score Breakdown'},
    {id:'curriculum', icon:I.curr,      label:'Curriculum'},
    {id:'plan',       icon:I.analytics, label:'Improvement Plan'},
  ];

  return (
    <div className="results-layout">
      {showConfetti && <Confetti/>}

      {/* Sidebar */}
      <div className="results-sidebar">
        {/* Brand */}
        <div style={{padding:'4px 8px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#818CF8,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>{I.brief}</div>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:'var(--primary)'}}>{user.name.split(' ')[0]}</div>
              <div style={{fontSize:11,color:'var(--text-m)'}}>{profile.role}</div>
            </div>
          </div>
        </div>

        <button className="btn btn-primary btn-sm" onClick={onNew} style={{width:'100%',justifyContent:'center',marginBottom:12,fontSize:13}}>
          + Start New Session
        </button>

        <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
          {navItems.map(item => (
            <div key={item.id} className={`nav-item ${activeTab===item.id?'active':''}`}
              onClick={()=>setActiveTab(item.id)}>
              {item.icon} {item.label}
            </div>
          ))}
        </div>

        <div style={{borderTop:'1px solid var(--border)',paddingTop:10,display:'flex',flexDirection:'column',gap:3}}>
          <div className="nav-item" onClick={printReport}>{I.print} Print Report</div>
          <div className={`nav-item ${activeTab==='support'?'active':''}`} onClick={()=>setActiveTab('support')}>{I.support} Support</div>
          <div className={`nav-item ${activeTab==='settings'?'active':''}`} onClick={()=>setActiveTab('settings')}>{I.settings} Settings</div>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Top bar */}
        <div style={{height:56,background:'var(--white)',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 28px',flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:16,display:'flex',alignItems:'center',gap:8}}>
            <span>Interview Results Dashboard</span>
            <span className="badge badge-indigo" style={{fontSize:11}}>{activeTab.toUpperCase()}</span>
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <button className="btn btn-ghost btn-sm" onClick={printReport} style={{gap:6}}>{I.print} Print</button>
            <button className="btn btn-ghost btn-sm" onClick={downloadJsonReport} style={{gap:6}}>Export JSON</button>
            <button className="btn btn-primary btn-sm" onClick={onNew}>+ New Interview</button>
            <div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,#818CF8,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:13}}>
              {user.name[0]}
            </div>
          </div>
        </div>

        {/* Content */}
        <div style={{flex:1,overflowY:'auto',padding:'28px'}}>
          {loading ? (
            <div>
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 200px',gap:16}}>
                  <div className="shimmer" style={{height:200,borderRadius:18}}/>
                  <div className="shimmer" style={{height:200,borderRadius:18}}/>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
                  {[1,2,3].map(i=><div key={i} className="shimmer" style={{height:200,borderRadius:18}}/>)}
                </div>
              </div>
              <div style={{textAlign:'center',marginTop:20,color:'var(--text-m)',fontSize:14}}>
                <div className="spinner-dark spinner" style={{margin:'0 auto 10px'}}/>
                Generating your evaluation report...
              </div>
            </div>
          ) : !report ? (
            <div className="card" style={{padding:40,textAlign:'center'}}>
              <div style={{fontSize:24,marginBottom:12}}>⚠️</div>
              <div style={{color:'var(--text-m)',marginBottom:16}}>Report unavailable. The interview may not have completed.</div>
              <button className="btn btn-primary" onClick={onNew}>Start New Interview</button>
            </div>
          ) : (
            <div className="fade-in">

              {/* ─────────────────────────────────────────────────────────────
                  TAB 1: OVERVIEW
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'overview' && (
                <div>
                  {/* Top row */}
                  <div className="results-grid-top">
                    {/* Assessment card */}
                    <div className="card" style={{padding:'28px 32px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,color:'var(--text-m)',fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>
                        {I.brief} Technical Assessment
                      </div>
                      <h2 style={{fontSize:30,fontWeight:800,lineHeight:1.15,marginBottom:10}}>Technical Interview Results</h2>
                      <p style={{color:'var(--text-m)',fontSize:14,marginBottom:20}}>
                        Comprehensive evaluation for <strong>{user.name}</strong> — {profile.role}.
                      </p>
                      {/* Recommendation */}
                      <div style={{display:'flex',alignItems:'center',gap:16,background:'var(--bg)',borderRadius:12,padding:'14px 18px'}}>
                        <div style={{width:40,height:40,borderRadius:'50%',background:'var(--primary-lt)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--primary)',flexShrink:0}}>{I.shield}</div>
                        <div>
                          <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text-m)',marginBottom:4}}>Recommendation</div>
                          <div style={{fontSize:14,lineHeight:1.5}}>
                            <strong style={{color:recColor(report.recommendation)}}>{recLabel(report.recommendation)}</strong>
                            {report.summary ? ` — ${report.summary}` : ''}
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Score box */}
                    <div className="results-score-box" style={{borderRadius:18}}>
                      <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',opacity:.75,marginBottom:6}}>Overall Score</div>
                      <div style={{fontSize:60,fontWeight:900,lineHeight:1,marginBottom:4}}>
                        {Math.round(report.overall_score)}
                        <span style={{fontSize:22,fontWeight:400,opacity:.7}}> / 100</span>
                      </div>
                      <div style={{marginTop:12,padding:'5px 16px',borderRadius:99,border:'1.5px solid rgba(255,255,255,.4)',fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>
                        {recLabel(report.recommendation)}
                      </div>
                      <div style={{marginTop:14,fontSize:12,opacity:.65}}>
                        {report.question_count}Q · {report.unique_days_covered} topics · {report.follow_up_count} follow-ups
                      </div>
                    </div>
                  </div>

                  {/* Middle row */}
                  <div className="results-grid-mid">
                    {/* Score breakdown */}
                    <div className="card" style={{padding:'22px'}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:18,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{display:'flex',alignItems:'center',gap:7}}>{I.chart} Score Breakdown</span>
                        <button onClick={()=>setActiveTab('skills')} style={{border:'none',background:'none',color:'var(--primary)',cursor:'pointer',fontSize:12,fontWeight:600}}>View Details →</button>
                      </div>
                      {scoreRows.map(([label, val]) => (
                        <div key={label} style={{marginBottom:12}}>
                          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:13}}>
                            <span style={{color:'var(--text-b)'}}>{label}</span>
                            <span style={{fontWeight:600,color:scoreColor(val)}}>{val}</span>
                          </div>
                          <div className="score-track">
                            <div className="score-fill" style={{width:`${val}%`,background:scoreColor(val),'--target-w':`${val}%`}}/>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Key strengths */}
                    <div className="card" style={{padding:'22px'}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:16,display:'flex',alignItems:'center',gap:7}}>
                        {I.shield} Key Strengths
                      </div>
                      {(report.strengths?.length ? report.strengths : ['Solid fundamentals']).slice(0,5).map((s,i) => (

                    <div className="card" style={{padding:'22px'}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{display:'flex',alignItems:'center',gap:7}}>{I.trend} Improvement Plan</span>

                      {(report.improvement_plan?.length ? report.improvement_plan : ['Keep practicing']).slice(0,4).map((item,i) => {

                            <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:3,display:'flex',gap:6}}>

                            {desc && <div style={{fontSize:12,color:'var(--text-m)',lineHeight:1.5,paddingLeft:14}}>{desc}</div>}
