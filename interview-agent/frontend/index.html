                  {report.knowledge_gaps?.length > 0 && (
                    <div className="card results-gap-card" style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:20}}>
                      <div style={{marginTop:2,flexShrink:0}}>{I.warn}</div>
                      <div>
                        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Identified Knowledge Gaps</div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                          {report.knowledge_gaps.slice(0,10).map((g,i) => (
                            <span key={i} style={{padding:'5px 12px',borderRadius:7,background:'#FFF7ED',border:'1px solid #FED7AA',fontSize:11.5,fontWeight:600,color:'#C2410C',textTransform:'uppercase',letterSpacing:'.04em'}}>
                              {g}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ─────────────────────────────────────────────────────────────
                  TAB 2: SCORE BREAKDOWN
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'skills' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <div className="card" style={{padding:'28px'}}>
                    <h3 style={{fontSize:20,fontWeight:800,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                      {I.chart} Dimensional Skill Breakdown
                    </h3>
                    <p style={{color:'var(--text-m)',fontSize:14,marginBottom:24}}>
                      Detailed performance scoring weighted across key technical evaluation dimensions.
                    </p>

                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
                      {scoreRows.map(([label, val]) => (
                        <div key={label} style={{background:'var(--bg)',padding:16,borderRadius:12,border:'1px solid var(--border)'}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                            <span style={{fontWeight:700,fontSize:15}}>{label}</span>
                            <span style={{fontWeight:800,fontSize:16,color:scoreColor(val)}}>{val} / 100</span>
                          </div>
                          <div className="score-track" style={{height:8,marginBottom:10}}>
                            <div className="score-fill" style={{width:`${val}%`,background:scoreColor(val),'--target-w':`${val}%`}}/>
                          </div>
                          <div style={{fontSize:12,color:'var(--text-m)',lineHeight:1.4}}>
                            {val >= 80 ? 'Demonstrated strong mastery and clear technical understanding.' :
                             val >= 65 ? 'Solid understanding with minor areas for expansion.' :
                             'Requires additional study and practical practice.'}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card" style={{padding:'28px'}}>
                    <h4 style={{fontSize:16,fontWeight:700,marginBottom:16,display:'flex',alignItems:'center',gap:8}}>
                      {I.shield} Key Strengths & Demonstrated Evidence
                    </h4>
                    <div style={{display:'flex',flexDirection:'column',gap:12}}>
                      {(report.strengths?.length ? report.strengths : ['Solid fundamental computer science background']).map((s,i) => (
                        <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',background:'var(--green-l)',padding:'12px 16px',borderRadius:10,border:'1px solid #A7F3D0'}}>
                          <span style={{color:'var(--green)',fontWeight:700,fontSize:16}}>✓</span>
                          <span style={{fontSize:14,color:'#065F46',lineHeight:1.5}}>{s}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ─────────────────────────────────────────────────────────────
                  TAB 3: CURRICULUM
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'curriculum' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <div className="card" style={{padding:'28px'}}>
                    <h3 style={{fontSize:20,fontWeight:800,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                      {I.curr} Curriculum Coverage & Topic Evaluation
                    </h3>
                    <p style={{color:'var(--text-m)',fontSize:14,marginBottom:24}}>
                      Detailed view of performance across all curriculum days tested during your interview.
                    </p>

                    {report.curriculum_coverage?.length > 0 ? (
                      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:16}}>
                        {report.curriculum_coverage.map((c,i) => (
                          <div key={i} style={{padding:'20px',borderRadius:14,background:'var(--white)',border:'1.5px solid var(--border)',boxShadow:'var(--sh)'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                              <span className="badge badge-indigo">Day {c.day}</span>
                              <span className="badge badge-gray">{c.questions_asked} Questions</span>
                            </div>
                            <h4 style={{fontSize:16,fontWeight:700,marginBottom:12}}>{c.topic}</h4>
                            <div style={{marginBottom:10}}>
                              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:600,marginBottom:4}}>
                                <span>Average Score</span>
                                <span style={{color:scoreColor(c.average_score,10)}}>{c.average_score} / 10</span>
                              </div>
                              <div className="score-track" style={{height:6}}>
                                <div className="score-fill" style={{width:`${(c.average_score/10)*100}%`,background:scoreColor(c.average_score,10)}}/>
                              </div>
                            </div>
                            <div style={{fontSize:12,color:'var(--text-m)',display:'flex',alignItems:'center',gap:6}}>
                              <span>Evidence Strength:</span>
                              <strong style={{color:'var(--text)',textTransform:'capitalize'}}>{c.evidence_strength || 'Moderate'}</strong>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div style={{padding:20,color:'var(--text-m)'}}>No curriculum coverage details logged.</div>
                    )}
                  </div>
                </div>
              )}

              {/* ─────────────────────────────────────────────────────────────
                  TAB 4: IMPROVEMENT PLAN
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'plan' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <div className="card" style={{padding:'28px'}}>
                    <h3 style={{fontSize:20,fontWeight:800,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                      {I.analytics} Personalized Improvement Plan
                    </h3>
                    <p style={{color:'var(--text-m)',fontSize:14,marginBottom:24}}>
                      Actionable recommendations to help you master identified knowledge gaps and advance to the next technical level.
                    </p>

                    <div style={{display:'flex',flexDirection:'column',gap:16}}>
                      {(report.improvement_plan?.length ? report.improvement_plan : ['Review baseline data structures and system design fundamentals']).map((item,i) => {
                        const parts = item.split(':');
                        const title = parts.length > 1 ? parts[0] : `Recommendation #${i+1}`;
                        const desc  = parts.length > 1 ? parts.slice(1).join(':').trim() : item;
                        return (
                          <div key={i} style={{display:'flex',gap:16,padding:'18px',borderRadius:12,background:'var(--bg)',border:'1px solid var(--border)'}}>
                            <div style={{width:36,height:36,borderRadius:10,background:'var(--primary-lt)',color:'var(--primary)',fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                              {i+1}
                            </div>
                            <div>
                              <h4 style={{fontSize:15,fontWeight:700,marginBottom:4}}>{title}</h4>
                              <p style={{fontSize:13.5,color:'var(--text-b)',lineHeight:1.6}}>{desc}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {report.knowledge_gaps?.length > 0 && (
                    <div className="card" style={{padding:'28px'}}>
                      <h4 style={{fontSize:16,fontWeight:700,marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
                        {I.warn} Target Focus Topics
                      </h4>
                      <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                        {report.knowledge_gaps.map((gap,i) => (
                          <div key={i} style={{padding:'8px 14px',borderRadius:8,background:'var(--amber-l)',border:'1px solid #FDE68A',fontSize:13,fontWeight:600,color:'var(--amber)',display:'flex',alignItems:'center',gap:6}}>
                            <span>📌</span> {gap}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ─────────────────────────────────────────────────────────────
                  TAB 5: SUPPORT
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'support' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <div className="card" style={{padding:'28px'}}>
                    <h3 style={{fontSize:20,fontWeight:800,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                      {I.support} Support & Platform Help Center
                    </h3>
                    <p style={{color:'var(--text-m)',fontSize:14,marginBottom:24}}>
                      Need assistance with your interview results, technical setup, or platform features? We're here to help.
                    </p>

                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
                      {/* FAQs */}
                      <div>
                        <h4 style={{fontSize:15,fontWeight:700,marginBottom:14}}>Frequently Asked Questions</h4>
                        <div style={{display:'flex',flexDirection:'column',gap:12}}>
                          <div style={{padding:14,borderRadius:10,background:'var(--bg)',border:'1px solid var(--border)'}}>
                            <div style={{fontWeight:700,fontSize:13.5,marginBottom:4}}>How is my overall score computed?</div>
                            <div style={{fontSize:12.5,color:'var(--text-m)',lineHeight:1.5}}>
                              Your score is deterministically calculated using weighted dimension metrics (Technical Correctness, Depth, Problem Solving, Practical Application, and Communication) powered by RAG rubrics.
                            </div>
                          </div>

                          <div style={{padding:14,borderRadius:10,background:'var(--bg)',border:'1px solid var(--border)'}}>
                            <div style={{fontWeight:700,fontSize:13.5,marginBottom:4}}>Can I retake an interview?</div>
                            <div style={{fontSize:12.5,color:'var(--text-m)',lineHeight:1.5}}>
                              Yes! You can click "+ Start New Session" in the top bar to restart an adaptive session tailored to your updated skills or focus topics.
                            </div>
                          </div>

                          <div style={{padding:14,borderRadius:10,background:'var(--bg)',border:'1px solid var(--border)'}}>
                            <div style={{fontWeight:700,fontSize:13.5,marginBottom:4}}>What are RAG and MCP tools?</div>
                            <div style={{fontSize:12.5,color:'var(--text-m)',lineHeight:1.5}}>
                              RAG (Retrieval-Augmented Generation) indexes technical domain knowledge, while MCP (Model Context Protocol) allows Claude to perform tool calls to verify technical accuracy.
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Contact form */}
                      <div style={{background:'var(--bg)',padding:20,borderRadius:12,border:'1px solid var(--border)'}}>
                        <h4 style={{fontSize:15,fontWeight:700,marginBottom:12}}>Submit Feedback or Report Issue</h4>
                        <form onSubmit={sendSupportMsg}>
                          <div className="field">
                            <label className="label">User Email</label>
                            <input className="input" type="text" value={user.email} disabled style={{background:'var(--border-l)'}}/>
                          </div>
                          <div className="field">
                            <label className="label">Message / Details</label>
                            <textarea className="textarea" style={{height:100}} placeholder="Describe your question or issue..." value={supportMsg} onChange={e=>setSupportMsg(e.target.value)}/>
                          </div>
                          <button className="btn btn-primary btn-sm" type="submit" style={{width:'100%',justifyContent:'center'}}>
                            Submit Ticket {I.arrow}
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ─────────────────────────────────────────────────────────────
                  TAB 6: SETTINGS
              ───────────────────────────────────────────────────────────── */}
              {activeTab === 'settings' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  <div className="card" style={{padding:'28px'}}>
                    <h3 style={{fontSize:20,fontWeight:800,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                      {I.settings} System & Platform Settings
                    </h3>
                    <p style={{color:'var(--text-m)',fontSize:14,marginBottom:24}}>
                      Configure system integrations, AI engine capabilities, and candidate preferences.
                    </p>

                    <div style={{display:'flex',flexDirection:'column',gap:20}}>
                      {/* Candidate info */}
                      <div style={{padding:16,borderRadius:12,background:'var(--bg)',border:'1px solid var(--border)'}}>
                        <h4 style={{fontSize:15,fontWeight:700,marginBottom:10}}>Candidate Profile Settings</h4>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,fontSize:13}}>
                          <div><strong>Name:</strong> {user.name}</div>
                          <div><strong>Email:</strong> {user.email}</div>
                          <div><strong>Role:</strong> {profile.role}</div>
                          <div><strong>Experience:</strong> {profile.exp} Years</div>
                        </div>
                      </div>

                      {/* Engine Toggles */}
                      <div style={{padding:16,borderRadius:12,background:'var(--bg)',border:'1px solid var(--border)'}}>
                        <h4 style={{fontSize:15,fontWeight:700,marginBottom:12}}>AI Engine Options</h4>
                        
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                          <div>
                            <div style={{fontWeight:600,fontSize:14}}>RAG Knowledge Retrieval</div>
                            <div style={{fontSize:12,color:'var(--text-m)'}}>Ground questions in TF-IDF indexed domain knowledge base</div>
                          </div>
                          <span className="badge badge-green">ENABLED</span>
                        </div>

                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0'}}>
                          <div>
                            <div style={{fontWeight:600,fontSize:14}}>MCP Tool Executor</div>
                            <div style={{fontSize:12,color:'var(--text-m)'}}>Allows Claude to call search & rubric tools dynamically</div>
                          </div>
                          <span className="badge badge-green">ENABLED</span>
                        </div>
                      </div>

                      {/* Data Management */}
                      <div style={{padding:16,borderRadius:12,background:'var(--bg)',border:'1px solid var(--border)'}}>
                        <h4 style={{fontSize:15,fontWeight:700,marginBottom:12}}>Data Management & Export</h4>
                        <div style={{display:'flex',gap:12}}>
                          <button className="btn btn-ghost btn-sm" onClick={downloadJsonReport}>{I.print} Download JSON Report</button>
                          <button className="btn btn-danger btn-sm" onClick={onNew}>Clear Current Session</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════════════════════════ */
function App() {
  const { toasts, show: toast } = useToast();

  // Persisted user from localStorage
  const [user, setUser] = useState(() => LS.get('ai_interview_user'));
  const [profile, setProfile] = useState(null);
  const [interviewState, setInterviewState] = useState(null);
  const [interviewId, setInterviewId] = useState(null);

  // Screen routing
  const [screen, setScreen] = useState('landing');

  const goLanding  = () => setScreen('landing');
  const goLogin    = () => setScreen('login');
  const goProfile  = () => setScreen('profile');

  const handleLogin = (u) => {
    setUser(u);
    LS.set('ai_interview_user', u);
    setScreen('profile');
  };

  const handleLogout = () => {
    LS.del('ai_interview_user');
    setUser(null);
    setScreen('landing');
  };

  const handleProfileDone = (state, prof) => {
    setInterviewState(state);
    setProfile(prof);
    setScreen('briefing');
  };

  const handleBeginInterview = () => setScreen('interview');

  const handleInterviewComplete = (id) => {
    setInterviewId(id);
    setScreen('results');
  };

  const handleNewInterview = () => {
    setInterviewState(null);
    setInterviewId(null);
    setProfile(null);
    setScreen('profile');
  };

  // If user clicks Start on landing
  const handleGetStarted = () => {
    if (user) setScreen('profile');
    else setScreen('login');
  };

  return (
    <>
      <ToastContainer toasts={toasts}/>

      {screen === 'landing' && (
        <LandingScreen onStart={handleGetStarted} user={user}/>
      )}
      {screen === 'login' && (
        <LoginScreen onLogin={handleLogin} onBack={goLanding} toast={toast}/>
      )}
      {screen === 'profile' && user && (
        <ProfileSetup user={user} onContinue={handleProfileDone} onLogout={handleLogout} toast={toast}/>
      )}
      {screen === 'briefing' && user && profile && interviewState && (
        <BriefingScreen user={user} profile={profile} interviewState={interviewState} onBegin={handleBeginInterview}/>
      )}
      {screen === 'interview' && user && profile && interviewState && (
        <InterviewScreen initialState={interviewState} user={user} profile={profile}
          onComplete={handleInterviewComplete} toast={toast}/>
      )}
      {screen === 'results' && user && (
        <ResultsScreen interviewId={interviewId} user={user} profile={profile || {role:'Candidate'}}
          onNew={handleNewInterview} toast={toast}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
